name: CI

on:
  pull_request:

jobs:
  markdown:
    name: Markdown 検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Markdown lint を実行
        run: npx --yes markdownlint-cli2 --config .markdownlint.jsonc "README.md" "CLAUDE.md" "docs/**/*.md" ".github/**/*.md"

  frontend:
    name: フロントエンド検査
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --passWithNoTests

  backend:
    name: バックエンド検査
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: pip install -r requirements.txt
      - name: 単体テストを実行
        run: pytest -q tests/unit
