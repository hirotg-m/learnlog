name: CD (prod)

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: フロントエンド デプロイ (prod)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_ENDPOINT: ${{ secrets.PROD_API_ENDPOINT }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: S3 に同期
        run: aws s3 sync dist/ s3://${{ secrets.PROD_S3_BUCKET }} --delete
      - name: CloudFront キャッシュ削除
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.PROD_CF_DISTRIBUTION_ID }} --paths "/*"

  deploy-backend:
    name: バックエンド デプロイ (prod)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -t package/
      - run: cp -r . package/ && cd package && zip -r ../lambda.zip .
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Lambda を更新
        run: aws lambda update-function-code --function-name ${{ secrets.PROD_LAMBDA_FUNCTION_NAME }} --zip-file fileb://lambda.zip
